name: Test CPython Interpreters Installers
on:
  workflow_dispatch:

jobs:
  test-all:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: show-runner
        run: uname -a || ver

      - name: test-linux-installer
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          bash -c 'curl -fsSL "https://raw.githubusercontent.com/feloopy/engine/$(curl -fsSL -H '\''Accept: application/vnd.github.v3+json'\'' -H '\''User-Agent: curl'\'' https://api.github.com/repos/feloopy/engine 2>/dev/null | sed -nE '\''s/.*\"default_branch\": *\"([^\"]+)\".*/\1/p'\'' || echo main)/interpreters/cpython/install-linux.sh" | bash'

      - name: test-macos-installer
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          bash -c 'curl -fsSL "https://raw.githubusercontent.com/feloopy/engine/$(curl -fsSL -H '\''Accept: application/vnd.github.v3+json'\'' -H '\''User-Agent: curl'\'' https://api.github.com/repos/feloopy/engine 2>/dev/null | sed -nE '\''s/.*\"default_branch\": *\"([^\"]+)\".*/\1/p'\'' || echo main)/interpreters/cpython/install-macos.sh" | bash'

      - name: test-windows-powershell-installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $t=[int]((Get-Date).ToUniversalTime() - (Get-Date '1970-01-01')).TotalSeconds
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          $u='https://raw.githubusercontent.com/feloopy/engine/main/interpreters/cpython/install-windows.ps1?t='+$t
          iex (Invoke-WebRequest -Uri $u).Content

      - name: test-windows-cmd-style
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "$t=[int]((Get-Date).ToUniversalTime()-(Get-Date '1970-01-01')).TotalSeconds; $u='https://raw.githubusercontent.com/feloopy/engine/main/interpreters/cpython/install-windows.ps1?t='+$t; iex (Invoke-WebRequest -Uri $u).Content"
